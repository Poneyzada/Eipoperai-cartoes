<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Metallic Gold Linear Gradient -->
    <linearGradient id="epGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#FFD54F" />
      <stop offset="55%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Chip Gold Gradient -->
    <linearGradient id="epChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1" />
      <stop offset="35%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Deep Obsidian Card Gradient -->
    <linearGradient id="epCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c24" />
      <stop offset="50%" stop-color="#121216" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>

    <!-- Squircle Background Gradient -->
    <linearGradient id="epSquircleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131318" />
      <stop offset="100%" stop-color="#050506" />
    </linearGradient>

    <!-- Soft Golden Ambient Glow -->
    <radialGradient id="epAmbient" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.3" />
      <stop offset="65%" stop-color="#F59E0B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Drop Shadow for the Card -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- 1. Outer App Squircle (Deep Black with Gold Metallic Border) -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" fill="url(#epSquircleBg)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" fill="url(#epAmbient)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" fill="none" stroke="url(#epGold)" stroke-width="1.8" />

  <!-- 2. Centered Luxury Credit Card -->
  <g filter="url(#cardShadow)">
    <!-- Card Base -->
    <rect x="9.5" y="16.5" width="45" height="31" rx="5" fill="url(#epCardBg)" stroke="url(#epGold)" stroke-width="1.5" />

    <!-- Sleek Diagonal Sheen/Reflection -->
    <path d="M10 26 L26 17 H34 L17 33 Z" fill="#FFE082" fill-opacity="0.12" />

    <!-- EMV Golden Microchip -->
    <g transform="translate(14.5, 23)">
      <rect width="11" height="8.5" rx="1.6" fill="url(#epChip)" stroke="#FFF9C4" stroke-width="0.4" />
      <!-- Circuit lines -->
      <line x1="0" y1="4.25" x2="11" y2="4.25" stroke="#78350F" stroke-width="0.6" />
      <line x1="5.5" y1="0" x2="5.5" y2="8.5" stroke="#78350F" stroke-width="0.6" />
      <line x1="2.75" y1="0" x2="2.75" y2="4.25" stroke="#78350F" stroke-width="0.5" />
      <line x1="8.25" y1="4.25" x2="8.25" y2="8.5" stroke="#78350F" stroke-width="0.5" />
    </g>

    <!-- Contactless Payment Waves (NFC) -->
    <g transform="translate(29.5, 27.2)" stroke="url(#epGold)" stroke-width="1.2" stroke-linecap="round" fill="none">
      <path d="M0 -3 A 3.6 3.6 0 0 1 0 3" />
      <path d="M2.5 -5 A 6 6 0 0 1 2.5 5" />
    </g>

    <!-- Luxury Gold 4-Point Star / Sparkle in Top-Right Corner -->
    <g transform="translate(47.5, 16.5)">
      <path d="M0 -3.5 C0 -1 1 0 3.5 0 C1 0 0 1 0 3.5 C0 1 -1 0 -3.5 0 C-1 0 0 -1 0 -3.5 Z" fill="#FFFBEB" />
      <circle cx="0" cy="0" r="0.8" fill="#FFD54F" />
    </g>

    <!-- "EP" Monogram (Eipô Peraí) in Heavy Gold Fintech Typography -->
    <text x="49.5" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" fill="url(#epGold)" text-anchor="end" letter-spacing="-0.5">EP</text>
  </g>
</svg>